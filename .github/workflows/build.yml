name: Build

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        run: echo "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset clang-cl-release

      - name: Build
        run: cmake --build --preset clang-cl-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protocol-dumper
          path: |
            build/release/protocol_dumper.dll
            build/release/injector.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: protocol-dumper

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/protocol_dumper.dll
            build/release/injector.exe
